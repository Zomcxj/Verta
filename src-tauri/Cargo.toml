[package]
name = "verta"
version = "0.0.1"
description = "Verta — 桌面工作台：本机 agent 会话、终端、编辑器与 Git"
license = "Apache-2.0"
edition = "2021"
default-run = "verta"

[workspace]
members = ["crates/verta-cli", "crates/verta-control-protocol"]
default-members = [".", "crates/verta-cli", "crates/verta-control-protocol"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Real-application benchmark ("app lab", scripts/app-lab). Never part of a shipped build: it adds
# the bench-only commands in modules/bench.rs and refuses to run under the product identifier.
bench = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "verta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# macos-private-api backs the transparent window NSVisualEffectView needs.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
memchr = "2"
verta-control-protocol = { path = "crates/verta-control-protocol" }
portable-pty = "0.9"
dirs = "7"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
nucleo-matcher = "0.3"
shared_child = "1"
# Screenshots are stored as PNG. `image` is already in the dependency tree (a transitive dep
# upstream left behind), so enable only png here rather than dragging in a pile of decoders.
image = { version = "0.25", default-features = false, features = ["png"] }
# The `.docx` reader (modules/docx.rs): a Word file is a ZIP of XML. `zip` is taken without its
# default features - those add zopfli, zlib-rs and four other codecs for formats a document does not
# use - so only its flate2 backend is on. flate2 is named here too because that backend has to come
# from somewhere: zip declares it with `default-features = false`, and the Deflate entries Word
# writes need a decompressor that is actually enabled.
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
quick-xml = { version = "0.39", default-features = false }
# Pictures are handed to the pane as `data:` URLs, which is base64 in a string.
base64 = { version = "0.22", default-features = false }
# A `.csv` from Excel on a Chinese Windows is GB18030, not UTF-8.
encoding_rs = { version = "0.8", default-features = false, features = ["fast-gb-hanzi-encode"] }
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
# One reqwest for the whole app: tauri-plugin-updater already pulls 0.13 with
# the platform verifier. `rustls-no-provider` + the explicit ring provider below
# keep it to a single TLS stack and no aws-lc.
reqwest = { version = "0.13", default-features = false, features = [
	"rustls-no-provider",
	"http2",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
which = "8.0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
drag = "2"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
tempfile = "3"
wasmparser = { version = "=0.259.0", default-features = false, features = ["std", "validate", "features", "simd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# inotify (Linux) and ReadDirectoryChangesW (Windows). macOS drives FSEvents
# directly (see fs/watch/macos.rs), which keeps notify out of that build.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = "8.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSPasteboard", "NSPasteboardItem", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSURL", "NSString", "NSUserDefaults", "NSValue"] }
fsevent-sys = "4.1"
window-vibrancy = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
# The OS-level proxy setting (registry) is read by reqwest only with this
# feature, and the previous reqwest honoured it unconditionally on Windows.
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }
windows-sys = { version = "0.61", features = [
	"Wdk_System_SystemServices",
	"Win32_Foundation",
	"Win32_Graphics_Dwm",
	"Win32_Graphics_Gdi",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_Console",
	"Win32_System_DataExchange",
	"Win32_System_JobObjects",
	"Win32_System_LibraryLoader",
	"Win32_System_Ole",
	"Win32_System_SystemInformation",
	"Win32_System_ProcessStatus",
	"Win32_System_Registry",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree via tauri; used directly for the file clipboard.
gtk = "0.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

# rust-lang/rust#110536: stripping proc-macro dylibs breaks the dlopen rustc does
# at compile time on macOS, reported as a bogus E0463. Never shipped, so nothing to strip.
[profile.release.build-override]
strip = false
