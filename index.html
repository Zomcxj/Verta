<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verta</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("verta-ui-theme-shadow");
          var resolved =
            t === "light" || t === "dark"
              ? t
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(resolved);
          // Both modes are the brand theme's near-black, so the first paint is too: a grey flash
          // before the palette lands is exactly what this inline script exists to avoid. The two
          // arms stay spelled out because the test that keeps this in step with `PREPAINT_BG`
          // reads them as a ternary.
          document.documentElement.style.backgroundColor =
            resolved === "dark" ? "#0b0b0d" : "#0b0b0d";
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="terminal"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
