<?xml version="1.0" encoding="UTF-8"?>
<!--
  Verta 图标（简洁款，对应参考图 2）：深色圆角底 + 白色 V。

  手写矢量，坐标基于 1024 画布：底板 92..932（留 9% 边距，圆角 190），
  V 的左端 (298,310)、底 (512,697)、右端 (726,310)，笔画宽 132、圆头圆角，
  与参考图的比例对齐（左右各约 17%/83%，上下约 18%/80%）。
  方框之外透明：圆角方框由本图自己画。

  换颜色只改 plate / rim / armLeft / armRight 这四个 id 的 stop-color。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="plate" cx="40%" cy="26%" r="82%">
      <stop offset="0" stop-color="#202024"/>
      <stop offset="58%" stop-color="#131316"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>

    <linearGradient id="rim" x1="140" y1="110" x2="900" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a9aa6" stop-opacity="0.6"/>
      <stop offset="42%" stop-color="#55555f" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2a2a30" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 左臂：整条都亮，底部圆头就是 V 的尖 -->
    <linearGradient id="armLeft" x1="298" y1="244" x2="512" y2="763" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f7f7fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- 右臂：上端接近纯白，往下收成银灰（左臂压在它上面） -->
    <linearGradient id="armRight" x1="726" y1="244" x2="512" y2="763" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f8fb"/>
      <stop offset="55%" stop-color="#dedee6"/>
      <stop offset="100%" stop-color="#b4b4bf"/>
    </linearGradient>

    <filter id="crossShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect x="92" y="92" width="840" height="840" rx="190" fill="url(#plate)"/>
  <rect x="93.5" y="93.5" width="837" height="837" rx="188.5" fill="none"
        stroke="url(#rim)" stroke-width="3"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 右臂先画；左臂压在它上面，交接处留一道收敛的柔和投影 -->
    <path d="M726 310 L512 697" stroke="url(#armRight)" stroke-width="132"/>
    <path d="M298 310 L512 697" stroke="#050506" stroke-opacity="0.34" stroke-width="146"
          transform="translate(13 9)" filter="url(#crossShadow)"/>
    <path d="M298 310 L512 697" stroke="url(#armLeft)" stroke-width="132"/>
  </g>
</svg>