<?xml version="1.0" encoding="UTF-8"?>
<!--
  Verta 应用图标：深色圆角底 + 白色 V，带一点光影。

  画布 1024，底板边距 32（底板占 93.8%，和 Windows 任务栏里其它应用的分量对齐；
  想再大一点就把下面所有坐标按同一比例缩放，或干脆把边距改到 16）。
  圆角半径 217（≈底板边长的 22.6%）。

  V 的几何（均为画布坐标）：
    左端 (267.4, 290.9)、底 (512, 733.1)、右端 (756.6, 290.9)，笔画宽 150.9、圆头圆角。
    外沿因此在 y 215.4..808.6、x 191.9..832.1，到底板四边的留白分别是
    上 183.4 / 下 183.4 / 左 160 / 右 160，上下严格相等，左右相等。

  光影分三层，都很轻：
    1) 底板：顶部一道内高光（topBevel）、底部往下压暗（plateFloor）、左上角一团柔光（gloss）；
    2) V 投在底板上的影子（vCast），偏移一点、模糊一点，让 V 看起来是浮起来的；
    3) 两条臂各用一条横跨笔画宽度的渐变（armLeftFace / armRightFace）做柱面感，
       左臂更亮、右臂收灰，交接处再压一道短阴影。

  方框之外透明：圆角方框由本图自己画。换颜色只改 plate / rim / armLeftFace /
  armRightFace 这四个 id 的 stop-color。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="plate" cx="40%" cy="26%" r="82%">
      <stop offset="0" stop-color="#212125"/>
      <stop offset="58%" stop-color="#131316"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <clipPath id="plateClip">
      <rect x="32" y="32" width="960" height="960" rx="217"/>
    </clipPath>

    <!-- 底部压暗：让它看起来是个有厚度的圆角块 -->
    <linearGradient id="plateFloor" x1="0" y1="430" x2="0" y2="992" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>

    <!-- 顶部内高光：光从上方来 -->
    <linearGradient id="topBevel" x1="0" y1="36" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 左上角一团柔光 -->
    <radialGradient id="gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="90" y1="52" x2="960" y2="985" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8b8c4" stop-opacity="0.65"/>
      <stop offset="42%" stop-color="#55555f" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2a2a30" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 横跨笔画宽度的渐变：靠近上缘亮、下缘收灰，做出圆柱的转折 -->
    <linearGradient id="armLeftFace" x1="323.7" y1="548.5" x2="455.7" y2="475.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#d9d9e2"/>
    </linearGradient>
    <linearGradient id="armRightFace" x1="568.3" y1="475.5" x2="700.3" y2="548.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f4f8"/>
      <stop offset="55%" stop-color="#d6d6df"/>
      <stop offset="100%" stop-color="#ababb6"/>
    </linearGradient>

    <!-- 沿笔画方向的渐变，让上下两端也有明暗 -->
    <linearGradient id="armLeftLength" x1="267.4" y1="215.4" x2="512" y2="808.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8f8f9c" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="armRightLength" x1="756.6" y1="215.4" x2="512" y2="808.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8f8f9c" stop-opacity="0.34"/>
    </linearGradient>

    <filter id="vCast" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="crossShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="217" fill="url(#plate)"/>

  <g clip-path="url(#plateClip)">
    <rect x="32" y="32" width="960" height="960" fill="url(#plateFloor)"/>
    <ellipse cx="300" cy="180" rx="360" ry="190" fill="url(#gloss)"/>
    <rect x="44" y="44" width="936" height="936" rx="205" fill="none"
          stroke="url(#topBevel)" stroke-width="10"/>
  </g>

  <rect x="33.5" y="33.5" width="957" height="957" rx="215.5" fill="none"
        stroke="url(#rim)" stroke-width="3"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- V 投在底板上的影子 -->
    <g stroke="#050506" stroke-opacity="0.42" stroke-width="150.9" transform="translate(10 26)"
       filter="url(#vCast)">
      <path d="M756.6 290.9 L512 733.1"/>
      <path d="M267.4 290.9 L512 733.1"/>
    </g>
    <!-- 右臂：柱面渐变 + 沿长度的收灰 -->
    <path d="M756.6 290.9 L512 733.1" stroke="url(#armRightFace)" stroke-width="150.9"/>
    <path d="M756.6 290.9 L512 733.1" stroke="url(#armRightLength)" stroke-width="150.9"/>
    <!-- 交接处的短阴影 -->
    <path d="M267.4 290.9 L512 733.1" stroke="#050506" stroke-opacity="0.34" stroke-width="167"
          transform="translate(15 10)" filter="url(#crossShadow)"/>
    <!-- 左臂压在右臂上，更亮 -->
    <path d="M267.4 290.9 L512 733.1" stroke="url(#armLeftFace)" stroke-width="150.9"/>
    <path d="M267.4 290.9 L512 733.1" stroke="url(#armLeftLength)" stroke-width="150.9"/>
  </g>
</svg>