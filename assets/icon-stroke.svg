<?xml version="1.0" encoding="UTF-8"?>
<!--
  Verta 应用图标：深色圆角底 + 白色 V。

  画布 1024，底板边距 32（底板占 93.8%，和 Windows 任务栏里其它应用的分量对齐；
  想再大一点就把下面所有坐标按同一比例缩放，或干脆把边距改到 16）。
  圆角半径 217（≈底板边长的 22.6%）。

  V 的几何（均为画布坐标）：
    左端 (267.4, 290.9)、底 (512, 733.1)、右端 (756.6, 290.9)，笔画宽 150.9、圆头圆角。
    外沿因此在 y 215.4..808.6、x 191.9..832.1，到底板四边的留白分别是
    上 183.4 / 下 183.4 / 左 160 / 右 160，上下严格相等，左右相等。

  方框之外透明：圆角方框由本图自己画。换颜色只改 plate / rim / armLeft / armRight
  这四个 id 的 stop-color。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="plate" cx="40%" cy="26%" r="82%">
      <stop offset="0" stop-color="#202024"/>
      <stop offset="58%" stop-color="#131316"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>

    <linearGradient id="rim" x1="90" y1="52" x2="960" y2="985" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a9aa6" stop-opacity="0.6"/>
      <stop offset="42%" stop-color="#55555f" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2a2a30" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 左臂：整条都亮，底部圆头就是 V 的尖 -->
    <linearGradient id="armLeft" x1="267.4" y1="215.4" x2="512" y2="808.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f7f7fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- 右臂：上端接近纯白，往下收成银灰（左臂压在它上面） -->
    <linearGradient id="armRight" x1="756.6" y1="215.4" x2="512" y2="808.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f8fb"/>
      <stop offset="55%" stop-color="#dedee6"/>
      <stop offset="100%" stop-color="#b4b4bf"/>
    </linearGradient>

    <filter id="crossShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="217" fill="url(#plate)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="215.5" fill="none"
        stroke="url(#rim)" stroke-width="3"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 右臂先画；左臂压在它上面，交接处留一道收敛的柔和投影 -->
    <path d="M756.6 290.9 L512 733.1" stroke="url(#armRight)" stroke-width="150.9"/>
    <path d="M267.4 290.9 L512 733.1" stroke="#050506" stroke-opacity="0.34" stroke-width="167"
          transform="translate(15 10)" filter="url(#crossShadow)"/>
    <path d="M267.4 290.9 L512 733.1" stroke="url(#armLeft)" stroke-width="150.9"/>
  </g>
</svg>