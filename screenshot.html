<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verta — Screenshot</title>
    <style>
      /* This window covers the whole screen: not a single white edge, no scrollbar.
         The background has to be transparent: the pixels the gray layer doesn't dim
         must show the screen underneath. */
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>

  <body>
    <div id="screenshot-root"></div>
    <script type="module" src="/src/screenshot/main.tsx"></script>
  </body>
</html>
